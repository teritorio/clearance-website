title: 'State of the Map 2026 : les communs numériques font leurs preuves'
date: 2026-09-09
description: 'Nous étions au State of the Map 2026 à Paris (28-30 août) — 535 participants de 45 pays, 184 présentations. Nous y avons présenté Clearance, notre outil open-source de contrôle qualité pour les données OSM, et reçu des retours encourageants sur nos règles de quarantaine.'
