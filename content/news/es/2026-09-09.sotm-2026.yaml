title: 'State of the Map 2026: los comunes digitales demuestran su eficacia'
date: 2026-09-09
description: 'Estuvimos en el State of the Map 2026 en París (28-30 de agosto) — 535 participantes de 45 países, 184 ponencias. Presentamos Clearance, nuestra herramienta open-source de control de calidad para datos OSM, y recibimos comentarios alentadores sobre nuestras reglas de cuarentena.'
