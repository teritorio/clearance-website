title: 'State of the Map 2026: Digital Commons Demonstrate Their Effectiveness'
date: 2026-09-09
description: 'We attended State of the Map 2026 in Paris (28–30 August) — 535 participants from 45 countries, 184 talks. We presented Clearance, our open-source quality control tool for OSM data, and received encouraging feedback on our quarantine rules for preventing conflicting edits.'
